name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  c2pa:
    name: c2patool interop
    runs-on: ubuntu-latest
    env:
      C2PATOOL_VERSION: 0.27.22
      C2PATOOL_SHA256: 6f138ad53da1a62f1cd6ee71c60727efa27d13b811f4c0ea8c2a8528968b358b
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install c2patool
        run: |
          curl -sSfL -o "$RUNNER_TEMP/c2patool.tgz" "https://github.com/contentauth/c2pa-rs/releases/download/c2patool-v$C2PATOOL_VERSION/c2patool-v$C2PATOOL_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$C2PATOOL_SHA256  $RUNNER_TEMP/c2patool.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/c2patool.tgz" -C "$RUNNER_TEMP"
          echo "C2PATOOL=$RUNNER_TEMP/c2patool/c2patool" >> "$GITHUB_ENV"
      - run: go test -count=1 -run TestC2patool -v ./embed

  # The receipt tests that run the real externalize CLI on the testnet
  # fixtures (SPEC.md §8.2). They skip in the job above, which has no CLI.
  proof:
    runs-on: ubuntu-latest
    env:
      EXTERNALIZE: v0.2.0
      EXTERNALIZE_SHA256: e41fcdaee9a72e2e5021af8e41e020643694d4b7a324d536e2ae1ffb77ff7f60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install externalize
        run: |
          name="externalize-${EXTERNALIZE}-x86_64-unknown-linux-gnu"
          curl -fsSL -o "$RUNNER_TEMP/x.tar.gz" "https://github.com/Externalize-Labs/externalize/releases/download/${EXTERNALIZE}/${name}.tar.gz"
          echo "${EXTERNALIZE_SHA256}  $RUNNER_TEMP/x.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/x.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${name}" >> "$GITHUB_PATH"
      - run: externalize --version
      - run: go test -count=1 -v -run 'Externalize|Real|ResultSet' ./receipt/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: build the browser verifier
        run: GOOS=js GOARCH=wasm go vet ./cmd/wasm && GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/wasm
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
